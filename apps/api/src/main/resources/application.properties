# ==========================================
# DATABASES - NEO4J
# ==========================================
# Nota el prefijo "spring.neo4j" para que el starter lo lea autom�ticamente
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:tu_password}

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080
spring.application.name=DrunkGraph
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.docker.compose.enabled=false
spring.devtools.restart.exclude=target/**,openapi/**
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.urls[0].name=client
springdoc.swagger-ui.urls[0].url=/v3/api-docs/client
springdoc.swagger-ui.urls[0].display-name=Client API
springdoc.swagger-ui.urls[1].name=admin
springdoc.swagger-ui.urls[1].url=/v3/api-docs/admin
springdoc.swagger-ui.urls[1].display-name=Admin API

# ==========================================
# HTTP LOGGING
# ==========================================
logging.level.http=INFO
logging.level.root=WARN
logging.level.com.uvg.drunkgraph=INFO
logging.level.org.springframework.boot=INFO
logging.pattern.console=%d{HH:mm:ss} %highlight(%-5level) %cyan(%-20logger{0}) %msg%n

# ==========================================
# SECURITY - OAuth2 Resource Server (FusionAuth JWKS)
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${FUSIONAUTH_ISSUER_URI:http://localhost:9011}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${FUSIONAUTH_JWKS_URI:http://localhost:9011/.well-known/jwks.json}

# ==========================================
# CLOUDINARY
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}