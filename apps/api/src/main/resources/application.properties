# ==========================================
# DATABASES - NEO4J
# ==========================================
# Nota el prefijo "spring.neo4j" para que el starter lo lea autom�ticamente
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:tu_password}

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080
spring.application.name=DrunkGraph
spring.docker.compose.enabled=false

# ==========================================
# SECURITY - OAuth2 Resource Server (FusionAuth JWKS)
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${FUSIONAUTH_ISSUER_URI:http://localhost:9011}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${FUSIONAUTH_JWKS_URI:http://localhost:9011/.well-known/jwks.json}